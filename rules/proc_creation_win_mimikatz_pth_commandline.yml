title: Pass-the-Hash Attack via Mimikatz sekurlsa::pth
id: a4f6b8d3-1e9c-4d7a-8b3f-6c0e2a9d5f17
status: stable
description: |
    Detects command-line usage of Mimikatz's "sekurlsa::pth" module, which
    spawns a new process under a specified user/domain while injecting a
    captured NTLM hash into the resulting logon session, allowing the attacker
    to authenticate to other systems without knowing the plaintext password.
references:
    - https://attack.mitre.org/techniques/T1550/002/
    - https://github.com/gentilkiwi/mimikatz/wiki/module-~-sekurlsa
author: mcp-hayabusa detection engineering KB
date: 2026/07/16
tags:
    - attack.lateral-movement
    - attack.t1550.002
    - attack.s0002
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd:
        CommandLine|contains: 'sekurlsa::pth'
    selection_args:
        CommandLine|contains:
            - '/ntlm:'
            - '/user:'
    condition: selection_cmd and selection_args
falsepositives:
    - None expected; this command-line pattern is specific to Mimikatz.
level: critical
